plugins {
    id "com.android.application"
}

// Every build used to ship as versionCode 1 / versionName 1.0.0, so neither the phone nor the
// tester could tell one APK from another and Android had no reason to treat a fresh build as
// an upgrade. CI supplies its monotonically increasing run number; each published APK
// therefore outranks the previous one and can never look like a downgrade. A local build gets
// the base code, which is below every CI build and so never shadows one.
def baseVersionCode = 1
def baseVersionName = "1.0.1"
def buildNumber = (System.getenv("BUILD_NUMBER") ?: "").trim()
def commitSha = (System.getenv("GITHUB_SHA") ?: "").trim()

def resolvedVersionCode = baseVersionCode + (buildNumber.isNumber() ? buildNumber.toInteger() : 0)
// Informational only - upgrades are decided by versionCode alone - but it is what lets a
// tester read the version under App info and say exactly which build they are holding.
def resolvedVersionName = baseVersionName + (buildNumber.isEmpty()
        ? "+local"
        : (commitSha.isEmpty() ? "+${buildNumber}" : "+${buildNumber}.${commitSha.take(7)}"))

android {
    namespace "com.bigxreality.jorjinverifier"
    compileSdk 35

    defaultConfig {
        applicationId "com.bigxreality.jorjinverifier"
        minSdk 27
        // Pinned to 30 on purpose. JJSDK v1.3.3 (built 2022 against targetSdk 27) calls
        // PendingIntent.getBroadcast with flags=0 and the two-argument
        // Context.registerReceiver, both from the d.a helper that CameraManager holds.
        // Targeting 31+ makes the first throw IllegalArgumentException and targeting 34+
        // makes the second throw SecurityException, crashing the app the moment USB
        // permission is granted and the SDK actually proceeds to open the device.
        // Raising this requires a JJSDK build that passes the modern flags.
        targetSdk 30
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Signed with the debug key on purpose: this build is never published to a store,
            // it only has to install on a test phone. What matters is that it is NOT
            // debuggable - several OEM ROMs (MIUI, ColorOS, Funtouch) refuse to install a
            // debuggable APK that arrived from a browser, which is exactly how the tester
            // receives it. Keep minifyEnabled false so the vendor SDK's reflection-heavy
            // classes survive untouched.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation files("libs/jjsdk.aar")
    testImplementation "junit:junit:4.13.2"
}

// Fail early with a useful message instead of letting a truncated/broken SDK produce
// confusing Android compiler errors. The repository previously contained a 2-byte AAR.
tasks.register("verifyJjSdk") {
    def sdk = layout.projectDirectory.file("libs/jjsdk.aar")
    inputs.file(sdk)
    doLast {
        File aar = sdk.asFile
        if (!aar.isFile() || aar.length() < 1_000_000L) {
            throw new GradleException("app/libs/jjsdk.aar is missing or truncated; restore JJSDK v1.3.3")
        }
        def zip = new java.util.zip.ZipFile(aar)
        try {
            ["classes.jar", "jni/arm64-v8a/libjjsdk.so", "jni/armeabi-v7a/libjjsdk.so"].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("JJSDK AAR is missing required entry: ${entry}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("preBuild").configure { dependsOn("verifyJjSdk") }
