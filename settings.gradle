pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// The review transport rejects binary patches. The vendor AAR already exists in this
// repository's history, so materialize that exact blob before Android configures dependencies.
// This runs during Android Studio sync as well as every Gradle command, without duplicating
// 7.8 MB of binary data (or a much larger Base64 copy) in the pull request.
def jjSdkAar = file("app/libs/jjsdk.aar")
if (!jjSdkAar.isFile() || jjSdkAar.length() < 1_000_000L) {
    jjSdkAar.parentFile.mkdirs()
    def output = new FileOutputStream(jjSdkAar)
    def process = ["git", "cat-file", "blob", "ca510d9dc8680423da77be49aeb89eaa788e1bea"]
            .execute(null, rootDir)
    try {
        process.consumeProcessOutput(output, System.err)
        if (process.waitFor() != 0) {
            throw new GradleException("Cannot restore JJSDK; use a full Git clone (git fetch --unshallow)")
        }
    } finally {
        output.close()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "JorjinARVerifier"
include(":app")
