name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Materialize JJSDK from repository history
        run: git cat-file blob ca510d9dc8680423da77be49aeb89eaa788e1bea > app/libs/jjsdk.aar
      - name: Verify bundled JJSDK
        run: |
          echo "95847781d88ebe35cd54da5e427a2fce4071208800f42401c7378762f4c0cdea  app/libs/jjsdk.aar" | sha256sum --check --strict
          unzip -t app/libs/jjsdk.aar
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The APK is built and published before lint runs. Lint style findings must never
      # block delivery of a testable build; the hardware verification can only happen on
      # a real phone with the glasses attached.
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Verify and name APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/JorjinARVerifier-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JorjinARVerifier-debug-apk
          path: dist/JorjinARVerifier-v1.0.0-debug.apk
          if-no-files-found: error

      # Publish a rolling pre-release so the APK can be downloaded and installed directly
      # on a phone, without unzipping an Actions artifact. main keeps the stable
      # `debug-latest` tag; every other branch gets its own `debug-<branch>` tag, so a
      # feature build can be handed over for on-device verification without merging it
      # first. Never fails the build: if the repository denies contents:write to
      # workflows, the artifact above is still there.
      - name: Publish rolling debug release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG=debug-latest
          else
            TAG="debug-$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/JorjinARVerifier-v1.0.0-debug.apk \
            --title "Debug build (${GITHUB_SHA:0:7})" \
            --notes "自動建置的除錯版 APK，來自 commit ${GITHUB_SHA}。僅供實機驗證使用。" \
            --prerelease

      - name: Android Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
