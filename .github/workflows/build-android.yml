name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Materialize JJSDK from repository history
        run: git cat-file blob ca510d9dc8680423da77be49aeb89eaa788e1bea > app/libs/jjsdk.aar
      - name: Verify bundled JJSDK
        run: |
          echo "95847781d88ebe35cd54da5e427a2fce4071208800f42401c7378762f4c0cdea  app/libs/jjsdk.aar" | sha256sum --check --strict
          unzip -t app/libs/jjsdk.aar
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The selection layer is injected into CIBAR at runtime, so a syntax error in it would
      # not fail the build - it would just silently leave the experience unusable by gesture.
      - name: Test the injected selection layer
        run: |
          node --check app/src/main/assets/gesture-bridge.js
          npm install --no-save --no-fund --no-audit jsdom
          node app/src/test/js/gesture-bridge.test.cjs
          node app/src/test/js/gesture-test-page.test.cjs

      # The APK is built and published before lint runs. Lint style findings must never
      # block delivery of a testable build; the hardware verification can only happen on
      # a real phone with the glasses attached.
      # Both variants ship. The release APK is the one to hand a tester: it is identical
      # code but not debuggable, which several OEM ROMs require before they will install an
      # APK that arrived from a browser. The debug APK stays for adb/Android Studio work.
      - name: Build APKs
        env:
          # Monotonic per workflow run, so every published APK outranks the previous one and
          # the phone never sees a downgrade.
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Name APKs after the version they contain
        id: apks
        run: |
          set -eu
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          # Read the version back out of the APK rather than recomputing it, so the filename
          # can never disagree with what the phone will show under App info.
          BADGING="$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk)"
          CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          # '+' is legal in versionName but awkward in a URL, so the filename uses '-'.
          SLUG="$(echo "$NAME" | tr '+' '-')"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JorjinARVerifier-v${SLUG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/JorjinARVerifier-v${SLUG}-debug.apk"
          {
            echo "version_code=$CODE"
            echo "version_name=$NAME"
            echo "install_apk=JorjinARVerifier-v${SLUG}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"
          ls -l dist

      # Everything below runs against the APK that will actually be published. A tester can
      # only report "it will not install", so the checks that would otherwise happen on the
      # phone have to happen here.
      - name: Verify the published APK
        run: |
          set -eu
          for apk in dist/*.apk; do
            echo "=============== $apk"
            # 1. ZIP structure intact - rules out a truncated or corrupted upload.
            unzip -t "$apk" > /dev/null && echo "unzip -t: OK"
            # 2. Signature verifies, and print which certificate signed it. A different
            #    certificate from the installed build is what produces
            #    INSTALL_FAILED_UPDATE_INCOMPATIBLE on the phone.
            "$APKSIGNER" verify --verbose --print-certs "$apk" \
              | grep -Ei "verified using|Signer #1 certificate (DN|SHA-256)"
            # 3. Identity, SDK range, ABIs and - critically - the declared requirements.
            "$AAPT2" dump badging "$apk" > badging.txt
            grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label)" badging.txt
            grep -E "^(uses-feature|uses-permission)" badging.txt || echo "(no uses-feature/uses-permission beyond CAMERA)"
          done

      # The vendor AAR's manifest declares android.hardware.opengles.aep as required="true"
      # and pulls in audio/network/storage permissions this app never uses. Manifest merging
      # takes the most restrictive value, so the APK ended up demanding hardware the test
      # phone does not have and the installer refused it with no reason shown. The app
      # manifest strips them during merge; assert it here so a future SDK bump cannot put an
      # uninstallable APK back into a tester's hands.
      - name: Assert the merged manifest stays installable
        run: |
          set -eu
          "$AAPT2" dump badging "dist/${{ steps.apks.outputs.install_apk }}" > badging.txt
          for banned in \
            "android.hardware.opengles.aep" \
            "com.android.hardware.camera2.full" \
            "android.permission.RECORD_AUDIO" \
            "android.permission.WRITE_EXTERNAL_STORAGE" \
            "android.permission.READ_EXTERNAL_STORAGE"; do
            if grep -q "$banned" badging.txt; then
              echo "::error::$banned leaked back into the merged manifest from the vendor AAR"
              exit 1
            fi
          done
          # A required feature the phone lacks is refused by the installer, so allow none.
          if grep -E "^uses-feature:" badging.txt; then
            echo "::error::a required uses-feature would block installation on some phones"
            exit 1
          fi
          grep -q "uses-permission: name='android.permission.CAMERA'" badging.txt
          # INTERNET is ours: CibarActivity loads the experience from its deployed site.
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt
          grep -q "package: name='com.bigxreality.jorjinverifier'" badging.txt
          grep -q "targetSdkVersion:'30'" badging.txt
          echo "OK: package id, targetSdk 30 and no install-blocking requirement"

      - uses: actions/upload-artifact@v4
        with:
          name: JorjinARVerifier-apk
          path: dist/*.apk
          if-no-files-found: error

      # Publish a rolling pre-release so the APK can be downloaded and installed directly
      # on a phone, without unzipping an Actions artifact. main keeps the stable
      # `debug-latest` tag; every other branch gets its own `debug-<branch>` tag, so a
      # feature build can be handed over for on-device verification without merging it
      # first. Never fails the build: if the repository denies contents:write to
      # workflows, the artifact above is still there.
      - name: Publish rolling debug release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG=debug-latest
          else
            TAG="debug-$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          fi
          INSTALL_APK='${{ steps.apks.outputs.install_apk }}'
          VERSION_NAME='${{ steps.apks.outputs.version_name }}'
          VERSION_CODE='${{ steps.apks.outputs.version_code }}'
          {
            printf '自動建置的 APK，來自 commit `%s`。僅供實機驗證使用。\n\n' "$GITHUB_SHA"
            printf '| | |\n|---|---|\n'
            printf '| versionName | `%s` |\n' "$VERSION_NAME"
            printf '| versionCode | `%s` |\n' "$VERSION_CODE"
            printf '| applicationId | `com.bigxreality.jorjinverifier` |\n'
            printf '| minSdk / targetSdk | 27 / 30 |\n\n'
            printf '**手機安裝請下載 `%s`**（非 debuggable，相容各家 ROM 的安裝限制）。\n' "$INSTALL_APK"
            printf '檔名帶 `-debug` 的那支供 adb / Android Studio 偵錯使用。\n\n'
            printf '> 每次 CI 建置都會產生新的 debug 簽章金鑰，與手機上已安裝的版本簽章不同，\n'
            printf '> 直接覆蓋安裝會失敗（`INSTALL_FAILED_UPDATE_INCOMPATIBLE`）。\n'
            printf '> 請先移除舊版「佐臻 AR 硬體驗證」，或執行\n'
            printf '> `adb uninstall com.bigxreality.jorjinverifier`，再安裝這一版。\n'
          } > release-notes.md
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk \
            --title "$VERSION_NAME (${GITHUB_SHA:0:7})" \
            --notes-file release-notes.md \
            --prerelease

      - name: Android Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
